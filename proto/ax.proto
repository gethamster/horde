//
// Wire-compatible subset of google/ax pkg/apis/v1alpha1/ax.proto at
// d8ed0fe38bceb7842d3c47817d53d16ccdfcb601. Unused timestamp/status fields
// are omitted; opaque workspace configuration messages remain bytes so a
// nonempty foreign configuration cannot compare equal to our empty workspace.
syntax = "proto3";
package ax.v1alpha1;
service AX {
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc UpdateTask(UpdateTaskRequest) returns (Task);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc SuspendTask(SuspendTaskRequest) returns (Task);
  rpc ResumeTask(ResumeTaskRequest) returns (Task);
  rpc GetGateway(GetGatewayRequest) returns (Gateway);
  rpc UpdateGateway(UpdateGatewayRequest) returns (Gateway);
  rpc DeleteGateway(DeleteGatewayRequest) returns (DeleteGatewayResponse);
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);
}
message ObjectMeta { string name = 1; string atespace = 2; }
message Task { string api_version = 1; string kind = 2; ObjectMeta metadata = 3; TaskSpec spec = 4; TaskStatus status = 5; }
message TaskSpec {
  reserved 1; reserved "goal";
  bool suspend = 2; string image = 3; repeated string command = 4;
  repeated EnvVar env = 5; ResourceReqs resources = 6;
  repeated WorkspaceRef workspaces = 7; GatewayRef gateway = 8;
  reserved 9; reserved "policies"; bool debug = 10;
}
message EnvVar { string name = 1; string value = 2; }
message ResourceReqs { ResourceList requests = 1; ResourceList limits = 2; }
message ResourceList { string cpu = 1; string memory = 2; }
message WorkspaceRef { string name = 1; string path = 2; string goal = 3; }
message GatewayRef { string name = 1; }
message TaskStatus { string phase = 1; string id = 2; string actor = 3; string worker_ip = 4; repeated Condition conditions = 7; }
message Condition { string type = 1; string status = 2; string reason = 4; string message = 5; }
message Gateway { string api_version = 1; string kind = 2; ObjectMeta metadata = 3; GatewaySpec spec = 4; }
message GatewaySpec { repeated Listener listeners = 1; EgressConfig egress = 2; }
message Listener { string name = 1; int32 port = 2; string protocol = 3; }
message EgressConfig { EgressAllowlist allowlist = 1; }
message EgressAllowlist { repeated HostRule hosts = 1; }
message HostRule { string host = 1; int32 port = 2; }
message Workspace { string api_version = 1; string kind = 2; ObjectMeta metadata = 3; WorkspaceSpec spec = 4; }
message WorkspaceSpec { repeated bytes git = 1; bytes mcp = 2; bytes skills = 3; }
message GetTaskRequest { string atespace = 1; string name = 2; }
message UpdateTaskRequest { Task task = 1; }
message DeleteTaskRequest { string atespace = 1; string name = 2; }
message DeleteTaskResponse {}
message SuspendTaskRequest { string atespace = 1; string name = 2; }
message ResumeTaskRequest { string atespace = 1; string name = 2; }
message GetGatewayRequest { string atespace = 1; string name = 2; }
message UpdateGatewayRequest { Gateway gateway = 1; }
message DeleteGatewayRequest { string atespace = 1; string name = 2; }
message DeleteGatewayResponse {}
message GetWorkspaceRequest { string atespace = 1; string name = 2; }
message UpdateWorkspaceRequest { Workspace workspace = 1; }
message DeleteWorkspaceRequest { string atespace = 1; string name = 2; }
message DeleteWorkspaceResponse {}
