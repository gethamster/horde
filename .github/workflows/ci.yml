name: CI
on:
  push:
    branches: [main]
    paths-ignore: ['website/**', 'vercel.json', '.github/workflows/website.yml']
  pull_request:
    paths-ignore: ['website/**', 'vercel.json', '.github/workflows/website.yml']
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/rust-checks.yml

  # Build every release target on main so dependency caches are warm for tags.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      HORDE_RELEASE_PUBLIC_KEY: ${{ vars.HORDE_RELEASE_PUBLIC_KEY }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
        if: runner.os == 'Linux'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Confirm the binary needs no dynamic loader
        if: runner.os == 'Linux'
        run: |
          binary=target/${{ matrix.target }}/release/horde
          file "$binary"
          if readelf --program-headers "$binary" | grep -q INTERP; then
            echo "::error::$binary requests a dynamic loader and will not run on hosts without it"
            readelf --program-headers "$binary" | grep -A2 INTERP
            exit 1
          fi
      - name: Confirm the binary runs
        run: target/${{ matrix.target }}/release/horde --version
