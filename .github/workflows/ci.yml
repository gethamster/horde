name: CI
on:
  push:
    branches: ['**']
    paths-ignore: ['website/**', 'vercel.json', '.github/workflows/website.yml']
  pull_request:
    paths-ignore: ['website/**', 'vercel.json', '.github/workflows/website.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Select OpenSSL 3 for release verification
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 scripts/test_release.py

  # The release blocks on the Linux binaries being self-contained, but nothing
  # checked that until a tag was already pushed, so a toolchain change could
  # only fail during a release. Build both musl targets the way the release
  # does and assert the property here instead.
  linux-static:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes
      - name: Confirm the binary needs no dynamic loader
        run: |
          binary=target/${{ matrix.target }}/release/horde
          file "$binary"
          if readelf --program-headers "$binary" | grep -q INTERP; then
            echo "::error::$binary requests a dynamic loader and will not run on hosts without it"
            readelf --program-headers "$binary" | grep -A2 INTERP
            exit 1
          fi
      - name: Confirm the binary runs
        run: target/${{ matrix.target }}/release/horde --version
