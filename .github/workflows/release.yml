name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      HORDE_RELEASE_PUBLIC_KEY: ${{ vars.HORDE_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install static C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Validate release identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          assert os.environ['GITHUB_REF_NAME'] == 'v'+tomllib.load(open('Cargo.toml','rb'))['package']['version']
          assert re.fullmatch('[0-9a-f]{64}',os.environ['HORDE_RELEASE_PUBLIC_KEY'])
          assert open('website/public/release-key.hex').read().strip() == os.environ['HORDE_RELEASE_PUBLIC_KEY']
          PY
      - name: Select OpenSSL 3 for release verification
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 scripts/test_release.py
      - run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          # musl-gcc compiles the C dependencies, but it must not drive the
          # link. Ubuntu 22.04's musl-gcc defaults to a dynamic PIE and its spec
          # file injects an ELF interpreter, which silently defeated
          # +crt-static and produced an x86-64 binary that needed a musl loader.
          # Ubuntu 24.04's did not, so the two Linux targets disagreed. Link
          # self-contained instead, against the musl that ships with Rust, so
          # the result does not depend on a distro's musl-gcc defaults.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=yes
      # `file` reports a crt-static musl build as "static-pie linked", not
      # "statically linked", so test the property we actually need: no ELF
      # interpreter, meaning the binary runs without a loader installed.
      - name: Confirm Linux artifacts are self-contained
        if: runner.os == 'Linux'
        run: |
          binary=target/${{ matrix.target }}/release/horde
          file "$binary"
          if readelf --program-headers "$binary" | grep -q INTERP; then
            echo "::error::$binary requests a dynamic loader and will not run on hosts without it"
            readelf --program-headers "$binary" | grep -A2 INTERP
            exit 1
          fi
      - name: Confirm the built binary runs
        run: |
          reported=$(target/${{ matrix.target }}/release/horde --version)
          echo "$reported"
          test "$reported" = "horde ${GITHUB_REF_NAME#v}"
      - name: Package binary
        run: |
          mkdir release-archive
          cp target/${{ matrix.target }}/release/horde release-archive/horde
          tar -cf horde-${{ matrix.target }}.tar -C release-archive horde
      - uses: actions/upload-artifact@v4
        with:
          name: horde-${{ matrix.target }}
          path: horde-${{ matrix.target }}.tar
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prepare container binaries
        run: |
          mkdir -p dist/amd64 dist/arm64
          tar -xf dist/horde-x86_64-unknown-linux-musl.tar -C dist/amd64
          tar -xf dist/horde-aarch64-unknown-linux-musl.tar -C dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: packaging/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
      - name: Sign release
        env:
          HORDE_RELEASE_PRIVATE_KEY: ${{ secrets.HORDE_RELEASE_PRIVATE_KEY }}
          HORDE_RELEASE_PUBLIC_KEY: ${{ vars.HORDE_RELEASE_PUBLIC_KEY }}
          HORDE_RELEASE_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
        run: |
          umask 077
          export HORDE_RELEASE_PRIVATE_KEY_FILE="$RUNNER_TEMP/horde-release.pem"
          trap 'rm -f "$HORDE_RELEASE_PRIVATE_KEY_FILE"' EXIT
          printf '%s\n' "$HORDE_RELEASE_PRIVATE_KEY" > "$HORDE_RELEASE_PRIVATE_KEY_FILE"
          python3 scripts/release_manifest.py "${GITHUB_REF_NAME#v}" dist
          rm "$HORDE_RELEASE_PRIVATE_KEY_FILE"
      - name: Publish binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Source release already published."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar dist/manifest.json dist/manifest.sig dist/SHA256SUMS dist/install.sh dist/release-key.pem dist/release-key.hex --verify-tag --generate-notes "${flags[@]}"

      - name: Deliver signed assets to public release repository
        env:
          HORDE_ARTIFACT_DEPLOY_KEY: ${{ secrets.HORDE_ARTIFACT_DEPLOY_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/horde-artifact-deploy-key"
          hosts_file="$RUNNER_TEMP/horde-github-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$HORDE_ARTIFACT_DEPLOY_KEY" > "$key_file"
          curl --fail --silent --show-error https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com "+k for k in json.load(sys.stdin)["ssh_keys"]))' > "$hosts_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$hosts_file"
          git clone --depth=1 git@github.com:asomervell/horde-releases.git public-release
          if git -C public-release ls-remote --exit-code --tags origin "refs/tags/$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Public release tag already delivered."
            exit 0
          fi
          mkdir -p public-release/release
          cp dist/*.tar dist/manifest.json dist/manifest.sig dist/SHA256SUMS dist/install.sh dist/release-key.pem dist/release-key.hex public-release/release/
          git -C public-release config user.name horde-release
          git -C public-release config user.email horde-release@users.noreply.github.com
          git -C public-release add release
          git -C public-release commit -m "Publish $GITHUB_REF_NAME signed artifacts"
          git -C public-release tag "$GITHUB_REF_NAME"
          git -C public-release push origin "refs/tags/$GITHUB_REF_NAME"

  # A release is not done when the assets are pushed. It is done when a machine
  # with nothing installed can fetch the advertised version and run it. Both
  # halves of that have failed before: a build whose Linux binary needed a
  # loader, and a site advertising a version whose release never published.
  verify:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - name: Wait for the public release to serve this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 40); do
            reported=$(curl --fail --silent --location --proto '=https' \
              https://horde.sh/releases/latest/manifest.json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)
            if [ "$reported" = "$version" ]; then
              echo "horde.sh serves $version"
              exit 0
            fi
            echo "attempt $attempt: latest published is ${reported:-unavailable}, waiting for $version"
            sleep 30
          done
          echo "::error::horde.sh does not serve $version. The site would advertise a release nobody can install."
          exit 1
      - name: Install the published release the way a user would
        run: |
          curl --fail --silent --show-error --location --proto '=https' https://horde.sh/install -o install.sh
          sh install.sh --no-service
          export PATH="/usr/local/bin:$HOME/.local/bin:$PATH"
          reported=$(horde --version)
          echo "$reported"
          test "$reported" = "horde ${GITHUB_REF_NAME#v}"
      - name: Confirm the published binary needs no loader
        run: |
          binary=$(command -v horde || echo "$HOME/.local/bin/horde")
          file "$binary"
          if readelf --program-headers "$binary" | grep -q INTERP; then
            echo "::error::the published Linux binary requests a dynamic loader"
            exit 1
          fi

  # The redirect routes (/install, /releases/latest/*) follow GitHub's latest
  # release on their own, but the generated agent surface bakes the version at
  # build time. Without this the site keeps advertising the previous release
  # until something else happens to push main.
  deploy-website:
    needs: verify
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Redeploy horde.sh against the new release
        env:
          DEPLOY_HOOK: ${{ secrets.HORDE_WEBSITE_DEPLOY_HOOK }}
        run: |
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "::error::HORDE_WEBSITE_DEPLOY_HOOK is not set. ${GITHUB_REF_NAME} is published, but horde.sh will keep advertising the previous release until it rebuilds. Create a Vercel deploy hook for the production branch and save it as that secret."
            exit 1
          fi
          curl --fail --silent --show-error --location --proto '=https' -X POST "$DEPLOY_HOOK" -o /dev/null
          echo "Requested a production rebuild of horde.sh"
      - name: Confirm the site advertises this release
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 40); do
            reported=$(curl --fail --silent --location --proto '=https' \
              https://horde.sh/.well-known/mcp.json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)
            if [ "$reported" = "$version" ]; then
              echo "horde.sh advertises $version"
              exit 0
            fi
            echo "attempt $attempt: site advertises ${reported:-unavailable}, waiting for $version"
            sleep 30
          done
          echo "::error::horde.sh still advertises ${reported:-an unknown version} after redeploying for $version"
          exit 1
