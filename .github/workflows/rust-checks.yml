name: Rust checks
on:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: '["ubuntu-latest", "macos-15", "macos-15-intel"]'
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --all --check
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
        check: [lint, test]
    runs-on: ${{ matrix.os }}
    env:
      HORDE_RELEASE_PUBLIC_KEY: ${{ vars.HORDE_RELEASE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: dev-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.check }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Select OpenSSL 3 for release verification
        if: runner.os == 'macOS' && matrix.check == 'test'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: cargo clippy --locked --all-targets -- -D warnings
        if: matrix.check == 'lint'
      - run: cargo test --locked
        if: matrix.check == 'test'
      - run: python3 scripts/test_release.py
        if: matrix.check == 'test'
      - run: python3 scripts/test_merge_release_image.py
        if: matrix.check == 'test'
      - run: python3 scripts/test_live_smoke.py
        if: matrix.check == 'test'
